name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run cap:sync
      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: istanbul-match-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # Play Store build with the real AdMob ids. Unsigned here (no upload key in CI);
      # sign it with the upload key before uploading, or use the "Android release (AAB)" workflow.
      - run: npm run cap:sync:release
      - name: Release bundle (unsigned)
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: istanbul-match-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
