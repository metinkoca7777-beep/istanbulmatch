<!DOCTYPE html>
<html lang="en">
<head>
<!-- Tile, special and booster art: Microsoft Fluent Emoji (3D), Copyright (c) Microsoft Corporation, MIT License. https://github.com/microsoft/fluentui-emoji -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tatlı Kavga · An Istanbul Match-3 Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1505; --gold:#f2c14e; --gold2:#b8800f; --nar:#d8432f; --cini:#17a3b0; --cini2:#0b5f6e;
  --cream:#fff3d6; --navy:#10203f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#0c1832; } }
:root[data-theme="dark"]{ --navy:#0c1832; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; height:100%; position:relative; overflow:hidden; color:#fff; background:var(--navy);
  font-family:'Baloo 2', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
button{ font-family:inherit; cursor:pointer; border:0; touch-action:manipulation; color:inherit; }
button:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
.lil{ font-family:'Lilita One','Baloo 2',system-ui,sans-serif; font-weight:400; }
#scene{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }
.ferry{ animation:sail 26s linear infinite; }
@keyframes sail{ from{ transform:translateX(-120px); } to{ transform:translateX(520px); } }
.gull{ animation:bob 3s ease-in-out infinite; }
.gull.b{ animation-delay:-1.4s; }
@keyframes bob{ 50%{ transform:translateY(-8px); } }
.screen{ position:absolute; inset:0; display:none; flex-direction:column; z-index:1; }
.screen.on{ display:flex; }

/* pills & round buttons */
.topbar{ display:flex; align-items:center; gap:8px; padding:10px 12px 0; }
.pill{ height:36px; padding:0 12px 0 8px; border-radius:18px; background:linear-gradient(#24418f,#13245c); border:2px solid #f5c04a; box-shadow:0 0 0 2px #0a1330; display:flex; align-items:center; gap:4px; font-size:16px; font-weight:800; }
.pill b{ font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:18px; }
.spacer{ flex:1; }
.round{ width:42px; height:42px; border-radius:50%; flex:none; font-size:20px; background:radial-gradient(circle at 50% 30%,#3a63c8,#16296a); border:3px solid #f5c04a; box-shadow:0 0 0 2px #0a1330, 0 4px 0 #0a1330; display:flex; align-items:center; justify-content:center; }

/* ---------- HOME ---------- */
.title{ margin:10px 0 0; text-align:center; font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:clamp(52px,16vw,78px); line-height:.82; color:#ffe7a0;
  -webkit-text-stroke:6px #5c2304; paint-order:stroke fill; text-shadow:0 6px 0 #3b1502, 0 0 34px rgba(255,170,70,.55); transform:rotate(-3deg); }
.title span{ display:block; color:#ffcf4a; font-size:1.12em; }
.tagline{ margin:10px 0 0; text-align:center; font-size:16px; font-weight:700; color:#ffe9c4; text-shadow:0 2px 4px rgba(0,0,0,.6); }
.stage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 16px; }
.perde{
  position:relative; width:min(360px,100%); height:min(100%,270px); border-radius:18px 18px 10px 10px;
  background:radial-gradient(70% 70% at 50% 45%, #fff8df, #f6dc9c 60%, #d9a24a);
  border:10px solid #7a3e12; box-shadow:inset 0 0 0 3px var(--gold), inset 0 0 40px rgba(150,80,10,.45), 0 0 0 3px #3b1a05, 0 0 60px rgba(255,190,90,.45), 0 18px 30px rgba(0,0,0,.5);
  display:flex; align-items:flex-end; justify-content:space-between; padding:0 8px; overflow:hidden;
}
.perde::before{ content:''; position:absolute; left:-10px; right:-10px; top:-10px; height:26px; background:repeating-linear-gradient(90deg,#b8322a 0 22px,#8e2018 22px 44px); border-bottom:3px solid var(--gold); border-radius:12px 12px 40% 40%/12px 12px 14px 14px; }
.puppet{ width:44%; height:72%; position:relative; transform-origin:50% 100%; animation:sway 4s ease-in-out infinite; }
.puppet.k{ animation-delay:-2s; }
.puppet svg{ width:100%; height:100%; display:block; filter:drop-shadow(4px 6px 3px rgba(80,40,0,.35)); }
@keyframes sway{ 50%{ transform:rotate(-2.5deg) translateY(-3px); } }
.homeBubble{ position:absolute; left:50%; top:18px; transform:translateX(-50%); width:64%; background:#fff; color:var(--ink); border-radius:16px; padding:6px 12px; font-size:15px; line-height:1.25; text-align:center; border:3px solid var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.2); }
.homeBubble b{ display:block; font-size:12px; color:var(--nar); }
.nextCard{ margin:0 auto 12px; width:min(330px,88%); background:rgba(10,16,40,.6); border:2px solid rgba(242,193,78,.55); border-radius:16px; padding:8px 14px 10px; text-align:center; }
.nextCard span{ font-size:13px; color:#ffe9c4; }
.nextCard b{ display:block; font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:26px; line-height:1.05; color:#fff; }
.bar{ height:12px; border-radius:6px; background:rgba(255,255,255,.15); margin:6px 0 2px; overflow:hidden; border:2px solid rgba(0,0,0,.3); }
.bar i{ display:block; height:100%; background:linear-gradient(#ffe08a,#e6a21c); border-radius:6px; }
.nextCard small{ font-size:13px; color:#cfd8f0; }
.cta{
  display:block; margin:0 auto; width:min(300px,80%); padding:10px 0 12px; border-radius:24px;
  background:linear-gradient(#8fea62,#35b043 55%,#228c30); border:3px solid #0f4d17;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.45), 0 7px 0 #0f4d17, 0 12px 26px rgba(0,0,0,.45), 0 0 30px rgba(140,240,110,.35);
  font-family:'Lilita One',system-ui,sans-serif; font-size:42px; line-height:1; color:#fff; text-shadow:0 3px 0 #145c1d;
}
.cta small{ display:block; font-family:'Baloo 2',system-ui,sans-serif; font-weight:800; font-size:17px; margin-top:2px; text-shadow:0 1px 0 #145c1d; }
.cta:active{ transform:translateY(5px); box-shadow:inset 0 4px 0 rgba(255,255,255,.45), 0 2px 0 #0f4d17; }
.link{ display:block; margin:12px auto 14px; padding:8px 22px; border-radius:20px; background:rgba(10,16,40,.6); border:2px solid rgba(255,255,255,.35); font-size:16px; font-weight:800; }

.gameBg{ position:absolute; left:50%; bottom:90px; width:min(150vw,900px); transform:translateX(-50%); opacity:.16; pointer-events:none; filter:brightness(0) invert(1); }
.gameBg svg{ width:100%; height:auto; display:block; }
/* ---------- MAP HOME ---------- */
#home{ background:#2271c9; }
#mapView{ position:absolute; inset:0; overflow:auto; scrollbar-width:none; touch-action:pan-x pan-y; overscroll-behavior:none; -webkit-overflow-scrolling:touch; }
#mapView::-webkit-scrollbar{ display:none; }
#mapInner svg{ display:block; }
.pin{ cursor:pointer; }
.pin.locked .ico{ filter:grayscale(1); }
.pulse{ transform-box:fill-box; transform-origin:center; animation:ring 1.5s ease-out infinite; }
@keyframes ring{ from{ transform:scale(.9); opacity:1; } to{ transform:scale(1.45); opacity:0; } }
.bounce{ animation:bnc 1s ease-in-out infinite; }
@keyframes bnc{ 50%{ transform:translateY(-7px); } }
.pnum{ font-family:'Lilita One',system-ui,sans-serif; font-size:14px; fill:#fff; }
.pstar{ font-size:13px; fill:#ffcf3a; stroke:#5c3a05; stroke-width:3px; paint-order:stroke fill; letter-spacing:1px; }
.mlabel{ font-family:'Lilita One',system-ui,sans-serif; fill:#7a4a1a; fill-opacity:.8; stroke:#fff8e0; stroke-width:4px; paint-order:stroke fill; }
.mlabel.big{ fill:#b5301d; fill-opacity:.9; }
.wlabel{ font-family:'Baloo 2',system-ui,sans-serif; font-weight:800; font-style:italic; fill:#e9f6ff; fill-opacity:.9; letter-spacing:2px; }
.mapTop{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:10px 12px 26px; pointer-events:none;
  background:linear-gradient(rgba(10,19,48,.92), rgba(10,19,48,0)); }
.mapTop > *{ pointer-events:auto; }
.brand{ font-family:'Lilita One',system-ui,sans-serif; font-size:30px; line-height:.9; color:#ffe7a0; -webkit-text-stroke:5px #5c2304; paint-order:stroke fill; text-shadow:0 3px 0 #3b1502; }
.brand small{ display:block; margin-top:4px; font-family:'Baloo 2',system-ui,sans-serif; font-weight:800; font-size:12px; color:#fff; -webkit-text-stroke:0; text-shadow:0 1px 3px rgba(0,0,0,.6); }
.chapter{ position:absolute; top:66px; left:50%; transform:translateX(-50%); white-space:nowrap; pointer-events:none;
  background:linear-gradient(#ef4b3c,#a8201a); border:3px solid #f5c04a; box-shadow:0 0 0 3px #4a0c08, 0 4px 0 #4a0c08; border-radius:14px; padding:2px 16px 3px;
  font-family:'Lilita One',system-ui,sans-serif; font-size:17px; text-shadow:0 2px 0 #7a1a0c; }
.mapBottom{ position:absolute; left:8px; right:8px; bottom:10px; display:flex; align-items:center; gap:10px; padding:10px; border-radius:24px;
  background:linear-gradient(#24418f,#13245c); border:3px solid #f5c04a; box-shadow:0 0 0 3px #0a1330, inset 0 2px 0 rgba(255,255,255,.22), 0 14px 24px rgba(0,0,0,.45); }
.nextIco{ width:60px; height:60px; flex:none; border-radius:50%; background:radial-gradient(circle at 50% 35%,#e9f6ff,#8fcaf5); border:3px solid #f5c04a; box-shadow:0 0 0 3px #0a1330; overflow:hidden; }
.nextIco svg{ width:100%; height:100%; display:block; }
.nextTxt{ flex:1; min-width:0; line-height:1.1; }
.nextTxt span{ display:block; font-size:12px; font-weight:800; color:#d6e8ff; }
.nextTxt b{ display:block; font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nextTxt small{ display:block; font-size:12px; color:#e9f3ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mapBottom .cta{ width:auto; margin:0; padding:6px 20px 8px; font-size:30px; border-radius:20px; flex:none; }
.mapBottom .cta small{ font-size:13px; }
.placeArt{ width:132px; height:132px; margin:6px auto 4px; border-radius:50%; overflow:hidden; background:radial-gradient(circle at 50% 35%,#e9f6ff,#8fcaf5); border:4px solid #fff; box-shadow:0 0 0 4px #173b85, 0 8px 16px rgba(0,0,0,.25); }
.placeArt svg{ width:100%; height:100%; display:block; }
.placeSub{ font-weight:800; font-size:17px; color:#173b85; margin-top:8px; }
.fact{ text-align:left; background:#fff; border-radius:14px; padding:8px 12px 10px; margin:10px 0 4px; font-size:14.5px; line-height:1.4; box-shadow:inset 0 0 0 2px #e6c27a; }
.fact b{ display:block; color:#b5301d; font-size:13px; margin-bottom:2px; }

/* ---------- GAME (Ottoman night theme) ---------- */
#game{ background:#0d1442; }
.gscene{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.panelN{ background:linear-gradient(#24418f,#13245c); border:3px solid #f5c04a; box-shadow:0 0 0 3px #0a1330, inset 0 2px 0 rgba(255,255,255,.22), inset 0 -4px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.45); }
.hud{ position:relative; padding:10px 8px 0; }
.hudRow{ display:flex; align-items:center; gap:8px; }
.movesMedal{ width:82px; height:82px; flex:none; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
  background:radial-gradient(circle at 50% 32%, #3a63c8, #16296a 70%); border:5px solid #f5c04a;
  box-shadow:0 0 0 3px #0a1330, 0 0 0 7px rgba(245,192,74,.35), inset 0 3px 0 rgba(255,255,255,.25), 0 10px 20px rgba(0,0,0,.45); position:relative; z-index:2; }
.movesMedal small{ font-size:11px; font-weight:800; color:#ffe3a0; letter-spacing:.5px; }
.movesMedal b{ font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:38px; color:#fff; text-shadow:0 3px 0 #0a1330; }
.movesMedal.low{ background:radial-gradient(circle at 50% 32%, #ff6a4d, #a3180f 70%); animation:throb .7s ease-in-out infinite; }
@keyframes throb{ 50%{ transform:scale(1.08); } }
.goalsPanel{ flex:1; position:relative; border-radius:20px; padding:16px 6px 6px; margin-left:-22px; padding-left:24px;
  background:linear-gradient(#24418f,#13245c); border:3px solid #f5c04a; box-shadow:0 0 0 3px #0a1330, inset 0 2px 0 rgba(255,255,255,.22), 0 10px 22px rgba(0,0,0,.45); }
.lvlTag{ position:absolute; top:-13px; left:50%; transform:translateX(-50%); white-space:nowrap; z-index:2;
  background:linear-gradient(#e9473a,#a8201a); border:2px solid #f5c04a; box-shadow:0 0 0 2px #4a0c08, 0 3px 0 #4a0c08; border-radius:10px; padding:1px 14px 2px;
  font-family:'Lilita One',system-ui,sans-serif; font-size:15px; color:#fff; text-shadow:0 2px 0 #4a0c08; }
.goals{ display:flex; gap:10px; justify-content:center; align-items:center; min-height:58px; }
.goal{ position:relative; width:58px; height:58px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.28), rgba(255,255,255,.06)); box-shadow:inset 0 0 0 2px rgba(245,192,74,.45); }
.goal canvas{ filter:drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
.goal span{ position:absolute; right:-6px; bottom:-6px; min-width:26px; height:26px; padding:0 6px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:#fff; color:#13245c; border:2px solid #f5c04a; font-family:'Lilita One',system-ui,sans-serif; font-size:15px; line-height:1; box-shadow:0 2px 0 #0a1330; }
.goal.done span{ background:#3cc35a; color:#fff; border-color:#fff; }
.goal.bump span{ animation:bump .25s ease-out; }
@keyframes bump{ 40%{ transform:scale(1.35); } }
.gear{ width:46px; height:46px; border-radius:50%; flex:none; font-size:16px; font-weight:800; color:#13245c;
  background:radial-gradient(circle at 50% 30%, #fff4cc, #f5c04a 70%, #b07a12); box-shadow:0 0 0 3px #0a1330, 0 4px 0 #0a1330; }
#boardWrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; }
.frame{ position:relative; padding:8px; border-radius:24px;
  background:linear-gradient(145deg,#fff0b0,#e2a52a 30%,#ffe08a 52%,#c08414 75%,#ffe6a0);
  box-shadow:0 0 0 3px #4a2a06, 0 0 0 9px rgba(36,184,198,.55), 0 0 0 12px #0a1330, 0 24px 40px rgba(0,0,0,.6), 0 0 90px rgba(255,190,90,.35); }
#cv{ display:block; box-sizing:content-box; touch-action:none; border:4px solid #128a98; border-radius:16px; background:#9fc0ea; }
.nz{ position:absolute; width:26px; height:26px; border-radius:50%; z-index:2; border:2px solid #4a2a06;
  background:radial-gradient(circle, #0c0c14 0 18%, #3fa0ec 19% 42%, #fff 43% 62%, #0b3a8f 63%); box-shadow:0 2px 4px rgba(0,0,0,.4); }
.nz.tl{ left:-12px; top:-12px; } .nz.tr{ right:-12px; top:-12px; } .nz.bl{ left:-12px; bottom:-12px; } .nz.br{ right:-12px; bottom:-12px; }
.toast{ position:absolute; top:0; left:8px; right:8px; display:flex; align-items:center; gap:8px; pointer-events:none; z-index:5;
  opacity:0; transform:translateY(-12px) scale(.96); transition:opacity .2s, transform .2s; }
.toast.show{ opacity:1; transform:none; }
.toast.right{ flex-direction:row-reverse; }
.tpor{ width:64px; height:64px; flex:none; border-radius:50%; overflow:hidden; border:3px solid #f5c04a; box-shadow:0 0 0 3px #0a1330, 0 6px 12px rgba(0,0,0,.4); background:radial-gradient(#fff8df,#e9be6a); }
.tpor svg{ width:100%; height:100%; display:block; }
.tpor img{ width:120%; height:120%; margin:-4% 0 0 -10%; display:block; }
.tbub{ position:relative; max-width:76%; background:#fff8e6; color:#2a1505; border-radius:16px; padding:5px 12px 7px; font-size:15px; line-height:1.25; border:3px solid #f5c04a; box-shadow:0 0 0 3px #0a1330, 0 8px 16px rgba(0,0,0,.35); }
.tbub b{ display:block; font-size:12px; color:#b5301d; }
.bbar{ position:relative; margin:4px 10px 12px; padding:10px 10px 12px; border-radius:26px; display:flex; align-items:center; justify-content:space-around;
  background:linear-gradient(#24418f,#13245c); border:3px solid #f5c04a; box-shadow:0 0 0 3px #0a1330, inset 0 2px 0 rgba(255,255,255,.22), 0 10px 22px rgba(0,0,0,.45); }
.bst{ position:relative; width:64px; height:64px; border-radius:20px; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%, #4a76d8, #1b3480 75%); box-shadow:0 0 0 3px #f5c04a, 0 0 0 5px #0a1330, 0 6px 0 #0a1330; }
.bst img{ width:46px; height:46px; display:block; pointer-events:none; filter:drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
.bst small{ position:absolute; right:-9px; top:-9px; min-width:26px; height:26px; padding:0 6px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(#ff6a4d,#c9301c); border:2px solid #fff; color:#fff; font-family:'Lilita One',system-ui,sans-serif; font-size:15px; box-shadow:0 2px 0 #0a1330; }
.bst.active{ background:radial-gradient(circle at 50% 30%, #fff4cc, #f5c04a 75%); transform:translateY(-5px) scale(1.06); box-shadow:0 0 0 3px #fff, 0 0 0 5px #0a1330, 0 0 26px rgba(255,220,90,.95); }
.bst.empty{ filter:grayscale(1); opacity:.55; }
.bst.empty small{ background:#3cc35a; }
.host{ display:flex; align-items:center; gap:10px; text-align:left; background:linear-gradient(#24418f,#13245c); color:#fff; border-radius:16px; padding:6px 12px 6px 6px; margin:12px 0 0; box-shadow:0 0 0 2px #f5c04a, 0 0 0 4px #0a1330; }
.host img{ width:60px; height:60px; flex:none; border-radius:50%; background:radial-gradient(#fff8df,#e9be6a); border:3px solid #f5c04a; }
.host b{ display:block; font-size:13px; color:#ffd36a; }
.host span{ display:block; font-size:14px; line-height:1.3; }
/* ---------- MODAL ---------- */
#modal{ position:fixed; inset:0; background:rgba(6,10,26,.68); display:none; align-items:center; justify-content:center; padding:18px; z-index:10; }
#modal.on{ display:flex; }
.card{ position:relative; width:min(360px,100%); text-align:center; color:var(--ink); padding:32px 16px 18px; border-radius:26px;
  background:radial-gradient(120% 80% at 50% 0%, #fffaf0, #fbecc8 70%, #f2d89e); border:5px solid #f5c04a;
  box-shadow:inset 0 0 0 3px #fff6dc, inset 0 0 0 7px rgba(36,184,198,.35), 0 0 0 4px #0a1330, 0 0 0 10px rgba(36,65,143,.9), 0 0 0 13px #0a1330, 0 26px 44px rgba(0,0,0,.55); animation:pop .22s ease-out; margin-top:20px; }
.card .banner{ position:absolute; top:-20px; left:50%; transform:translateX(-50%); white-space:nowrap; padding:4px 22px 6px; border-radius:12px;
  background:linear-gradient(#ef4b3c,#a8201a); border:3px solid #f5c04a; box-shadow:0 0 0 3px #4a0c08, 0 5px 0 #4a0c08, 0 8px 14px rgba(0,0,0,.35); color:#fff; font-family:'Lilita One',system-ui,sans-serif; font-size:26px; line-height:1.1; text-shadow:0 2px 0 #4a0c08; }
.card p{ margin:8px 0; font-size:16px; }
.card .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:12px 0 2px; }
.card .goal{ background:linear-gradient(#24418f,#13245c); box-shadow:0 0 0 2px #f5c04a, 0 0 0 4px #0a1330; }
.btn{ font-family:'Lilita One',system-ui,sans-serif; font-size:21px; color:#fff; padding:9px 22px 11px; border-radius:18px; text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:linear-gradient(#8fea62,#35b043 55%,#228c30); border:3px solid #0f4d17; box-shadow:inset 0 3px 0 rgba(255,255,255,.4), 0 5px 0 #0f4d17; }
.btn:active{ transform:translateY(3px); box-shadow:inset 0 3px 0 rgba(255,255,255,.4), 0 2px 0 #0f4d17; }
.btn.alt{ background:linear-gradient(#6fb0ef,#2f6fb0 55%,#22558c); border-color:#13355c; box-shadow:inset 0 3px 0 rgba(255,255,255,.35), 0 5px 0 #13355c; }
.btn.warm{ background:linear-gradient(#ffe08a,#f2b630 55%,#d48e0c); border-color:#6b4205; color:#4a2a06; text-shadow:none; box-shadow:inset 0 3px 0 rgba(255,255,255,.5), 0 5px 0 #6b4205; }
.stars{ font-size:48px; line-height:1; color:#ffcf3a; -webkit-text-stroke:3px #6b4205; paint-order:stroke fill; letter-spacing:2px; }
.stars .off{ color:#d8c49a; -webkit-text-stroke:3px #a8916a; }
.quote{ font-size:15px; line-height:1.35; background:rgba(255,255,255,.6); border-radius:12px; padding:8px 10px; }
.lvGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function lin(g,x0,y0,x1,y1,stops){ const gr=g.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }

function crescent(g, r1, cx2, cy2, r2){
  const d=Math.hypot(cx2,cy2), a=(r1*r1-r2*r2+d*d)/(2*d), h=Math.sqrt(Math.max(0,r1*r1-a*a));
  const ux=cx2/d, uy=cy2/d, px=a*ux, py=a*uy;
  const p1=[px+h*-uy, py+h*ux], p2=[px-h*-uy, py-h*ux];
  const a1=Math.atan2(p1[1],p1[0]), a2=Math.atan2(p2[1],p2[0]);
  const b1=Math.atan2(p1[1]-cy2,p1[0]-cx2), b2=Math.atan2(p2[1]-cy2,p2[0]-cx2);
  g.beginPath(); g.arc(0,0,r1,a1,a2,false); g.arc(cx2,cy2,r2,b2,b1,true); g.closePath();
}

function update(dt){
  let moving = false;
  for (let r=0;r<R;r++) for (let c=0;c<C;c++){
    const cell = grid[r][c];
    if (cell.b && cell.b.shake > 0) cell.b.shake -= dt;
    const t = cell.t; if (!t) continue;
    const dx = c - t.x, dy = r - t.y;
    if (dx || dy){
      const d = Math.hypot(dx,dy), step = SPEED*dt;
      if (d <= step){ if (dy > .3) t.land = .18; t.x = c; t.y = r; } else { t.x += dx/d*step; t.y += dy/d*step; moving = true; }
    }
    if (t.sc < 1) t.sc = Math.min(1, t.sc + dt*5);
    if (t.land > 0) t.land = Math.max(0, t.land - dt);
  }
  dying = dying.filter(d => (d.life -= dt) > 0);
  parts = parts.filter(p => { p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += cs*16*dt; return p.life > 0; });
  fx = fx.filter(f => (f.t += dt) < f.d);
  floats = floats.filter(f => (f.t += dt) < f.d);
  if (shakeT > 0) shakeT -= dt;
  if (!moving && settleWaiters.length){ const w = settleWaiters; settleWaiters = []; w.forEach(f => f()); }
}

  s += `<g stroke-linecap="round"><path d="M433 553 L440 513" stroke="#5b6573" stroke-width="9"/><path d="M433 553 L440 513" stroke="#e6e9ee" stroke-width="5"/>
    <path d="M742 319 L818 361" stroke="#5b6573" stroke-width="10"/><path d="M742 319 L818 361" stroke="#e6e9ee" stroke-width="6"/><path d="M754 323 Q780 348 806 351" stroke="#e8433a" stroke-width="2.4" fill="none"/></g>`;
  MAP_LABELS.forEach(([t,x,y,fs,rot,cls]) => { s += `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle" class="mlabel ${cls}" transform="rotate(${rot} ${x} ${y})">${t}</text>`; });
  WATER_LABELS.forEach(([t,x,y,rot]) => { s += `<text x="${x}" y="${y}" font-size="17" text-anchor="middle" class="wlabel" transform="rotate(${rot} ${x} ${y})">${t}</text>`; });
  // ferries
  const ferry = `<g transform="translate(-14 -8)"><path d="M0 9 h28 l-4 6 h-20z" fill="#1d2b3a"/><rect x="2" y="3" width="24" height="6" fill="#fff"/><rect x="12" y="-3" width="5" height="6" fill="#f2c14e"/></g>`;
  s += `<g>${ferry}<animateMotion dur="18s" repeatCount="indefinite" path="M445 548 Q560 575 655 505 Q560 575 445 548"/></g>`;
  s += `<g>${ferry}<animateMotion dur="24s" repeatCount="indefinite" path="M452 520 Q610 640 700 722 Q610 640 452 520"/></g>`;
  // compass
  s += `<g transform="translate(940 820)" class="compass"><circle r="34" fill="#fff8e4" stroke="#173b85" stroke-width="3"/><path d="M0 -28 L7 0 L0 28 L-7 0Z" fill="#d8322a" stroke="#2a1505" stroke-width="1.5"/><path d="M0 0 L7 0 L0 28 L-7 0Z" fill="#fff"/><text y="-36" text-anchor="middle" class="mlabel" font-size="14">N</text></g>`;
  // route
  const pts = LEVELS.map(L => L.badge);
  s += `<path d="${smoothPath(pts)}" fill="none" stroke="#173b85" stroke-opacity=".35" stroke-width="11" stroke-linecap="round"/>`;
  s += `<path d="${smoothPath(pts)}" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="1 11" stroke-linecap="round"/>`;
  const doneN = Math.min(un, LEVELS.length);
  if (doneN >= 2) s += `<path d="${smoothPath(pts.slice(0, doneN))}" fill="none" stroke="#ffcf3a" stroke-width="7" stroke-linecap="round"/>`;
  LEVELS.forEach((L,i) => {
    const [px,py] = L.pt, [bx,by] = L.badge, locked = i+1 > un, cur = i+1 === un, st = save.stars[i] || 0;
    s += `<line x1="${px}" y1="${py}" x2="${bx}" y2="${by}" stroke="#2a1505" stroke-width="2.5" stroke-dasharray="3 4" opacity=".55"/><circle cx="${px}" cy="${py}" r="5" fill="#d8322a" stroke="#fff" stroke-width="2.2"/>`;
  });
  LEVELS.forEach((L,i) => {
    const [bx,by] = L.badge, locked = i+1 > un, cur = i+1 === un, st = save.stars[i] || 0;
    s += `<g class="pin${locked ? ' locked' : ''}${cur ? ' cur' : ''}" data-i="${i}" transform="translate(${bx} ${by})">`;
    if (cur) s += `<circle r="31" class="pulse" fill="none" stroke="#ffd34d" stroke-width="5"/>`;
    s += `<circle r="29" fill="#fff" stroke="#173b85" stroke-width="4"/><circle r="24" fill="url(#bbg)"/>`;
    s += `<g clip-path="url(#bclip)" class="ico"><svg x="-23" y="-25" width="46" height="46" viewBox="0 0 100 100">${LANDMARK[L.icon]}</svg></g>`;
    if (locked) s += `<circle r="24" fill="#2a3448" opacity=".45"/><path d="M-6 -2 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#fff" stroke-width="3"/><rect x="-9" y="-3" width="18" height="13" rx="3" fill="#fff"/>`;
    s += `<rect x="-15" y="19" width="30" height="17" rx="8.5" fill="${locked ? '#7d8796' : '#d8322a'}" stroke="#fff" stroke-width="2.4"/><text y="32" text-anchor="middle" class="pnum">${i+1}</text>`;
    if (!locked && st) s += `<text y="52" text-anchor="middle" class="pstar">${'★'.repeat(st)}${'☆'.repeat(3-st)}</text>`;
    if (cur) s += `<g class="bounce"><path d="M-11 -58 h22 l-11 14z" fill="#ffd34d" stroke="#2a1505" stroke-width="2.6" stroke-linejoin="round"/></g>`;
    s += `</g>`;
  });
  return s + '</svg>';
}
function centerOn(i, smooth){
  const v = $('mapView'), [bx,by] = LEVELS[i].badge;
  v.scrollTo({ left: bx*mapZ - v.clientWidth/2, top: by*mapZ - v.clientHeight*0.48, behavior: smooth ? 'smooth' : 'auto' });
}
function goalNeeds(L){
  let kil = 0, che = 0;
  if (L.map) L.map.forEach(row => { for (const ch of row){ if (ch === 'k') kil++; if (ch === 'K') kil += 2; if (ch === 's' || ch === 'S') che++; } });
  return L.goals.map(g => ({ ...g, need: g.kind === 'kilim' ? kil : g.kind === 'sandik' ? che : g.need }));
}
function openPlace(i){
  const L = LEVELS[i], locked = i+1 > save.unlocked;
  openModal(`<div class="banner">${i+1} · ${L.name}</div><div class="placeArt">${landmarkSVG(L.icon)}</div><div class="placeSub">${L.sub}</div>${L.npc ? `<div class="host"><img src="${IMGDATA[L.npc.k]}" alt=""><div><b>${L.npc.n}</b><span>“${L.npc.line}”</span></div></div>` : ''}<div class="fact"><b>Did you know?</b>${L.fact}</div>${locked ? '<p>Finish the previous stop to unlock this one.</p>' : `<p>Collect in <b>${L.moves} moves</b>:</p><div class="row" id="pg"></div>`}<div class="row">${locked ? '' : '<button class="btn" id="goBtn">Play</button>'}<button class="btn alt" id="closeP">${locked ? 'OK' : 'Close'}</button></div>`);
  if (!locked){
    goalNeeds(L).forEach(g => { const d = document.createElement('div'); d.className = 'goal'; d.append(iconFor(g, 44)); const sp = document.createElement('span'); sp.textContent = g.need; d.append(sp); $('pg').append(d); });
    $('goBtn').onclick = () => { closeModal(); startLevel(i, true); };
  }
  $('closeP').onclick = closeModal;
}
function renderHome(){
  const v = $('mapView');
  mapZ = Math.max(1.35, (v.clientHeight || 700) / MAPDATA.H);
  $('mapInner').innerHTML = buildMap();
  const next = Math.min(LEVELS.length, save.unlocked) - 1, L = LEVELS[next];
  $('starTotal').textContent = save.stars.reduce((a,b) => a + (b || 0), 0);
  $('nextName').textContent = L.name; $('nextSub').textContent = L.sub;
  $('nextIco').innerHTML = landmarkSVG(L.icon);
  $('playLvl').textContent = `Level ${next + 1}`;
  const ch = L.district, inCh = LEVELS.filter(x => x.district === ch), pos = inCh.indexOf(L) + 1;
  $('chapter').textContent = `${CHAPTERS[ch]} · ${pos}/${inCh.length}`;
  $('soundBtn').textContent = save.sound ? '🔊' : '🔇';
  requestAnimationFrame(() => centerOn(next, false));
}
function goToMap(){ closeModal(); talkTimers.forEach(clearTimeout); busy = true; show('home'); renderHome(); }
function initMapInput(){
  const v = $('mapView');
  v.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; panState = { x:e.clientX, y:e.clientY, sl:v.scrollLeft, st:v.scrollTop, moved:false }; });
  window.addEventListener('pointermove', e => { if (!panState) return; const dx = e.clientX - panState.x, dy = e.clientY - panState.y; if (Math.abs(dx) + Math.abs(dy) > 6) panState.moved = true; v.scrollLeft = panState.sl - dx; v.scrollTop = panState.st - dy; });
  window.addEventListener('pointerup', () => { setTimeout(() => { panState = null; }, 0); });
  $('mapInner').addEventListener('click', e => {
    if (panState && panState.moved) return;
    const pin = e.target.closest && e.target.closest('.pin'); if (!pin) return;
    ensureAudio(); openPlace(+pin.dataset.i);
  });
}

function startLevel(idx, fromCard){
  levelIdx = idx; level = LEVELS[idx]; colors = level.colors; movesLeft = level.moves; extraUsed = false;
  queue = []; dying = []; parts = []; fx = []; floats = []; selected = null; boosterMode = null; hint = null; busy = true;
  buildGrid(level.map);
  let kil = 0, che = 0;
  grid.forEach(row => row.forEach(cell => { kil += cell.k; if (cell.b) che++; }));
  goals = level.goals.map(g => ({ ...g, got:0, need: g.kind === 'kilim' ? kil : g.kind === 'sandik' ? che : g.need }));
  clearInterval(homeTimer); $('lvlName').textContent = `${idx+1} · ${level.name}`;
  show('game'); resize();
  fillInitial(); renderGoals(); updateHud(); updateBoosters();
  if (fromCard){ setTimeout(() => { busy = false; lastInput = performance.now(); dialog(level.npc ? [['N','']].concat(level.talk) : level.talk); }, 350); return; }
  say('H', level.talk[0][1]);
  openModal(`<div class="banner">${idx+1} · ${level.name}</div><p>Collect in <b>${level.moves} moves</b>:</p><div class="row" id="introGoals"></div><p class="quote"><b>Karagöz:</b> “${level.talk[1][1]}”</p><div class="row"><button class="btn" id="goBtn">Play</button><button class="btn alt" id="mapBtn">Map</button></div>`);
  goals.forEach(g => { const d = document.createElement('div'); d.className = 'goal'; d.append(iconFor(g, 42)); const s = document.createElement('span'); s.textContent = g.need; d.append(s); $('introGoals').append(d); });
  $('goBtn').onclick = () => { closeModal(); busy = false; lastInput = performance.now(); dialog(level.talk); };
  $('mapBtn').onclick = goToMap;
}
function showWin(stars){
  sfx('win');
  save.stars[levelIdx] = Math.max(save.stars[levelIdx] || 0, stars);
  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, levelIdx + 2));
  save.boost.terlik = Math.min(9, save.boost.terlik + 1);
  if (stars === 3){ save.boost.supurge = Math.min(9, save.boost.supurge + 1); save.boost.oklava = Math.min(9, (save.boost.oklava || 0) + 1); save.boost.zar = Math.min(9, (save.boost.zar || 0) + 1); }
  persist();
  const last = levelIdx === LEVELS.length - 1;
  openModal(`<div class="banner">${last ? 'Curtain call!' : level.name + ' cleared!'}</div><div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div><p class="quote"><b>Hacivat:</b> “${pick(WIN_H)}”</p>${last ? '' : `<div class="fact"><b>New stop unlocked: ${LEVELS[levelIdx+1].name}</b>${LEVELS[levelIdx+1].sub}</div>`}<p>Reward: 🩴 +1${stars === 3 ? '  🧹 +1  🎲 +1  ⚡ +1' : ''}</p><div class="row">${last ? '' : '<button class="btn" id="nextBtn">Continue</button>'}<button class="btn alt" id="mapBtn">Map</button></div>`);
  if (!last) $('nextBtn').onclick = () => { const n = levelIdx + 1; goToMap(); setTimeout(() => centerOn(n, true), 250); setTimeout(() => openPlace(n), 900); };
  $('mapBtn').onclick = goToMap;
}
function showLose(){
  sfx('lose'); talkTimers.forEach(clearTimeout); say('H','You have torn the curtain and left it in ruins!');
  openModal(`<div class="banner">The tea went cold!</div><p class="quote"><b>Hacivat:</b> “You have torn the curtain and left it in ruins!”<br><b>Karagöz:</b> “Brew another pot, I'll fix it!”</p><div class="row" id="loseGoals"></div><div class="row">${extraUsed ? '' : '<button class="btn warm" id="moreBtn">🍵 +5 moves</button>'}<button class="btn" id="retryBtn">Try again</button><button class="btn alt" id="mapBtn">Map</button></div>`);
  goals.filter(g => g.got < g.need).forEach(g => { const d = document.createElement('div'); d.className = 'goal'; d.append(iconFor(g, 36)); const s = document.createElement('span'); s.textContent = g.need - g.got; d.append(s); $('loseGoals').append(d); });
  if (!extraUsed) $('moreBtn').onclick = () => { extraUsed = true; movesLeft += 5; hudDirty = true; closeModal(); busy = false; lastInput = performance.now(); say('K','Fresh tea! Let\'s go!'); };
  $('retryBtn').onclick = () => { closeModal(); startLevel(levelIdx); };
  $('mapBtn').onclick = goToMap;
}

// ---------------- INPUT ----------------
let down = null;
function cellAt(e){
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left - cv.clientLeft, y = e.clientY - rect.top - cv.clientTop;
  const c = Math.floor(x/cs), r = Math.floor(y/cs);
  return inb(r,c) ? { r, c } : null;
}
cv.addEventListener('pointerdown', e => {
  ensureAudio(); if (busy) return;
  const p = cellAt(e); if (!p) return;
  lastInput = performance.now(); hint = null;
  if (boosterMode){ useBooster(p); return; }
  down = { p, x:e.clientX, y:e.clientY, moved:false };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!down || down.moved || busy) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, th = cs*.35;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  down.moved = true;
  const q = Math.abs(dx) > Math.abs(dy) ? { r:down.p.r, c:down.p.c + Math.sign(dx) } : { r:down.p.r + Math.sign(dy), c:down.p.c };
  selected = null;
  if (inb(q.r,q.c)) trySwap(down.p, q);
});
cv.addEventListener('pointerup', () => {
  if (!down) return;
  const d = down; down = null;
  if (d.moved || busy) return;
  const p = d.p, t = grid[p.r][p.c].t;
  if (selected && Math.abs(selected.r - p.r) + Math.abs(selected.c - p.c) === 1){ const s = selected; selected = null; trySwap(s, p); return; }
  if (t && t.special){ tapSpecial(p); return; }
  if (t) selected = (selected && selected.r === p.r && selected.c === p.c) ? null : p;
});
cv.addEventListener('pointercancel', () => { down = null; });
const BOOST_TXT = {
  terlik:['K','Where shall I throw it? Tap a tile!','No slippers left! Win a stop to earn another.'],
  oklava:['H','Which column shall the lightning strike? Tap a tile!','No lightning left! Win with three stars to earn more.'],
  supurge:['H','Which row shall we sweep? Tap a tile!','No brooms left! Win with three stars to earn more.']
};
function toggleBooster(kind){
  if (busy) return;
  const t = BOOST_TXT[kind];
  if ((save.boost[kind] || 0) <= 0){ quip('K', t[2]); return; }
  boosterMode = boosterMode === kind ? null : kind; selected = null;
  if (boosterMode) say(t[0], t[1]);
  updateBoosters();
}
$('bTerlik').onclick = () => toggleBooster('terlik');
$('bSupurge').onclick = () => toggleBooster('supurge');
$('bOklava').onclick = () => toggleBooster('oklava');
$('bZar').onclick = () => useZar();
$('backBtn').onclick = () => {
  if (busy || $('modal').classList.contains('on')) return;
  busy = true;
  openModal(`<div class="banner">Tea break</div><p class="quote"><b>Karagöz:</b> “A tea break? Two sugars for me!”</p><div class="row"><button class="btn" id="resumeBtn">Resume</button><button class="btn alt" id="mapBtn">Map</button></div>`);
  $('resumeBtn').onclick = () => { closeModal(); busy = false; lastInput = performance.now(); };
  $('mapBtn').onclick = goToMap;
};
$('soundBtn').onclick = () => { save.sound = !save.sound; persist(); $('soundBtn').textContent = save.sound ? '🔊' : '🔇'; ensureAudio(); };
$('playBtn').onclick = () => { ensureAudio(); openPlace(Math.min(LEVELS.length, save.unlocked) - 1); };
window.addEventListener('resize', () => { if ($('game').classList.contains('on')) resize(); else renderHome(); });

document.querySelectorAll('img[data-k]').forEach(im => { im.src = IMGDATA[im.dataset.k]; });
initMapInput();
renderHome();
imgReady.then(() => { cache = {}; });
requestAnimationFrame(frame);
})();
</script>
